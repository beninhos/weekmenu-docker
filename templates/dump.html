{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <h1 class="text-2xl font-extrabold tracking-tight text-[#2C2C2C]">Recepten-dump</h1>
    <p class="text-sm text-[#6B6B6B]">Gooi hier foto's van kookboekpagina's of een PDF in.
       De recepten worden automatisch herkend en verschijnen hieronder ter controle.</p>

    <!-- Dropzone -->
    <div id="dropzone"
         class="border-2 border-dashed border-[#E8E4DC] rounded-lg p-8 text-center cursor-pointer hover:border-[#8B4513] transition-colors">
        <input type="file" id="fileInput" class="hidden" multiple
               accept="image/*,application/pdf" onchange="startUpload(this.files)">
        <p class="font-medium">Sleep foto's of een PDF hierheen</p>
        <p class="text-sm text-[#6B6B6B] mt-1">of klik om te kiezen</p>
    </div>

    <!-- Job-status -->
    <div id="jobStatus" class="hidden text-sm flex items-center gap-2">
        <img id="jobBanana" src="{{ url_for('static', filename='uploads/dancing-banana.gif') }}" class="h-10 hidden">
        <span id="jobStatusText"></span>
        <button id="retryBtn" class="hidden underline text-[#8B4513]" onclick="retryJob()">Opnieuw proberen</button>
    </div>
    <div id="jobWarning" class="hidden text-sm text-amber-700 border border-amber-200 bg-amber-50 rounded p-3 mt-2"></div>

    <!-- Kookboek-keuze voor de hele batch -->
    <div class="flex items-center gap-3">
        <label class="text-sm font-medium">Kookboek voor opgeslagen recepten:</label>
        <select id="cookbookSelect" class="border border-[#E8E4DC] rounded px-2 py-1 text-sm">
            <option value="">— Geen —</option>
            {% for cb in cookbooks %}
            <option value="{{ cb.id }}">{{ cb.name }}</option>
            {% endfor %}
        </select>
        <label class="text-sm ml-4">Soort scan:</label>
        <select id="scanMode" class="border border-[#E8E4DC] rounded px-2 py-1 text-sm">
            <option value="boek">kookboekpagina's</option>
            <option value="kaart">receptkaarten — 2 pagina's per recept</option>
        </select>
    </div>

    <!-- Draft-kaarten -->
    <div id="draftList" class="space-y-4"></div>
</div>

{% include '_crop_modal.html' %}

<script>
const initialDrafts = {{ drafts | tojson }};
const initialJobs = {{ jobs | tojson }};
const staticUrlPrefix = "{{ url_for('static', filename='') }}";
let activeJobId = null;
let pollTimer = null;

/* ── XSS-escaping helper ── */
function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ── Dropzone ── */
const dz = document.getElementById('dropzone');
dz.onclick = () => document.getElementById('fileInput').click();
dz.ondragover = e => { e.preventDefault(); dz.classList.add('border-[#8B4513]'); };
dz.ondragleave = () => dz.classList.remove('border-[#8B4513]');
dz.ondrop = e => { e.preventDefault(); dz.classList.remove('border-[#8B4513]'); startUpload(e.dataTransfer.files); };

function imageUrl(imagePath) {
    if (!imagePath) return null;
    return staticUrlPrefix + imagePath.replace(/^static\//, '');
}

async function startUpload(files) {
    if (!files || files.length === 0) return;
    const fd = new FormData();
    Array.from(files).forEach(f => fd.append('files', f));
    fd.append('mode', document.getElementById('scanMode').value);
    setJobStatus('Uploaden...', true);
    try {
        const resp = await fetch('/dump/upload', { method: 'POST', body: fd });
        const data = await resp.json();
        if (data.status !== 'success') { setJobError(data.message); return; }
        activeJobId = data.job_id;
        setJobStatus('Recepten worden herkend...', true);
        pollTimer = setInterval(pollJob, 2500);
    } catch (err) {
        setJobError(err.message);
    }
}

async function pollJob() {
    const resp = await fetch(`/dump/status/${activeJobId}`);
    if (!resp.ok) {
        clearInterval(pollTimer);
        setJobError('Job niet gevonden');
        return;
    }
    const data = await resp.json();
    if (data.status === 'processing') return;
    clearInterval(pollTimer);
    if (data.status === 'error') { setJobError(data.error_message); return; }
    const paginas = data.page_count ? ` uit ${data.page_count} pagina('s)` : '';
    setJobStatus(`Klaar: ${data.drafts.length} recept(en) herkend${paginas}.`, false);
    if (data.warning) setJobWarning(data.warning);
    data.drafts.forEach(renderCard);
}

/* Een melding die geen fout is: de batch is af, maar er kan iets zijn
   kwijtgeraakt. Die moet blijven staan, want juist dan moet je gaan tellen. */
function setJobWarning(msg) {
    const box = document.getElementById('jobWarning');
    if (!box) return;
    box.textContent = msg;
    box.classList.remove('hidden');
}

async function retryJob() {
    if (!activeJobId) return;
    await fetch(`/dump/job/${activeJobId}/retry`, { method: 'POST' });
    setJobStatus('Opnieuw bezig...', true);
    pollTimer = setInterval(pollJob, 2500);
}

function setJobStatus(text, busy) {
    const box = document.getElementById('jobStatus');
    box.classList.remove('hidden');
    box.className = 'text-sm text-[#6B6B6B] flex items-center gap-2';
    document.getElementById('jobStatusText').textContent = text;
    document.getElementById('jobBanana').classList.toggle('hidden', !busy);
    document.getElementById('retryBtn').classList.add('hidden');
}

function setJobError(msg) {
    const box = document.getElementById('jobStatus');
    box.classList.remove('hidden');
    box.className = 'text-sm text-red-600 flex items-center gap-2';
    document.getElementById('jobStatusText').textContent = 'Fout: ' + (msg || 'onbekend');
    document.getElementById('jobBanana').classList.add('hidden');
    document.getElementById('retryBtn').classList.toggle('hidden', !activeJobId);
}

/* ── Draft-kaarten ── */
function renderCard(d) {
    const list = document.getElementById('draftList');
    const card = document.createElement('div');
    card.id = `draft-${d.id}`;
    card.className = 'border border-[#E8E4DC] rounded-lg p-4 flex gap-4';
    // Een regel met een eenheid maar zonder getal ('g kipfilets') valt in een
    // lijst van twintig niet op, terwijl hij bij opslaan geweigerd wordt. Hem
    // markeren scheelt zoeken.
    // Een regel waar Vision zelf aan twijfelde (een ½ die als kaal cijfer is
    // gelezen laat in de tekst geen spoor na) krijgt oranje en de reden erbij,
    // zodat je weet welke regel je tegen de bronfoto moet leggen.
    const ingHtml = d.ingredients.map(i => {
        const mist = (i.amount === null || i.amount === '') && (i.unit || '').trim();
        if (mist) return `<li class="text-red-600">hoeveelheid ontbreekt — ${esc(i.unit)} ${esc(i.name)}</li>`;
        if (i.check) return `<li class="text-orange-600" title="${esc(i.check)}">${esc(i.amount ?? '')} ${esc(i.unit ?? '')} ${esc(i.name)} — controleer: ${esc(i.check)}</li>`;
        return `<li>${esc(i.amount ?? '')} ${esc(i.unit ?? '')} ${esc(i.name)}</li>`;
    }).join('');
    // Een lege bereiding is op de kaart niet te zien zonder dit: de tekst
    // staat verderop wel in het formulier, maar hier moet je 'm missen vóórdat
    // je op Opslaan klikt, niet pas na de foutmelding.
    const bereidingHtml = (d.instructions || '').trim()
        ? `<p class="text-sm mt-2 whitespace-pre-wrap max-h-32 overflow-y-auto">${esc(d.instructions)}</p>`
        : `<p class="text-sm mt-2 text-red-600">bereiding ontbreekt</p>`;
    const img = imageUrl(esc(d.image_path));
    const cookbookSel = document.getElementById('cookbookSelect');
    const cbParam = cookbookSel && cookbookSel.value ? `&cookbook=${encodeURIComponent(cookbookSel.value)}` : '';
    const meta = [
        d.serves ? esc(d.serves) + ' personen' : '',
        d.prep_time ? '⏱ ' + esc(d.prep_time) + ' min' : '',
        d.source_page ? 'scan ' + esc(d.source_page) : '',
    ].filter(Boolean).join(' · ');
    const achterkant = imageUrl(esc(d.back_image_path));
    card.innerHTML = `
        ${img ? `<a href="${img}" target="_blank" title="Klik voor de volledige pagina" class="shrink-0">
                   <img src="${img}" class="w-40 h-40 object-cover rounded"></a>` : ''}
        <div class="flex-1 min-w-0">
            <h3 class="font-bold">${esc(d.name)}</h3>
            <p class="text-sm text-[#6B6B6B]">${meta}${achterkant ? ` · <a href="${achterkant}" target="_blank" class="underline">achterkant</a>` : ''}</p>
            <ul class="text-sm mt-1 list-disc list-inside text-[#6B6B6B] max-h-40 overflow-y-auto">${ingHtml}</ul>
            ${bereidingHtml}
            <div class="flex gap-2 mt-3">
                <button onclick="acceptDraft(${d.id})" class="px-3 py-1.5 bg-[#8B4513] text-white rounded text-sm">✓ Opslaan</button>
                <a href="/recipe/new?draft=${d.id}${cbParam}" class="px-3 py-1.5 border border-[#E8E4DC] rounded text-sm">✎ Aanpassen</a>
                ${img ? `<button onclick="openCrop(${d.id})" class="px-3 py-1.5 border border-[#E8E4DC] rounded text-sm">✂️ Bijsnijden</button>` : ''}
                <button onclick="rejectDraft(${d.id})" class="px-3 py-1.5 border border-[#E8E4DC] text-red-600 rounded text-sm">✗ Weg</button>
            </div>
        </div>`;
    list.appendChild(card);
}

async function acceptDraft(id) {
    const cookbook_id = document.getElementById('cookbookSelect').value || null;
    const resp = await fetch(`/dump/draft/${id}/accept`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cookbook_id }),
    });
    const data = await resp.json().catch(() => ({}));
    if (data.status === 'success') {
        document.getElementById(`draft-${id}`).remove();
        return;
    }
    // Opslaan geweigerd (ontbrekende hoeveelheid, of al afgehandeld): de reden
    // hoort bij de kaart te staan, anders lijkt de knop kapot.
    const kaart = document.getElementById(`draft-${id}`);
    let melding = kaart.querySelector('.accept-melding');
    if (!melding) {
        melding = document.createElement('p');
        melding.className = 'accept-melding text-sm text-red-600 mt-2';
        kaart.querySelector('div').appendChild(melding);
    }
    melding.textContent = data.message || 'Opslaan mislukt.';
}

async function rejectDraft(id) {
    await fetch(`/dump/draft/${id}/reject`, { method: 'POST' });
    document.getElementById(`draft-${id}`).remove();
}

/* ── Init: bestaande drafts + lopende jobs ── */
initialDrafts.forEach(renderCard);
// De jobs komen nieuwste eerst binnen. Alleen de eerste is 'de lopende batch';
// zonder deze grens wees activeJobId naar de OUDSTE, en stuurde 'Opnieuw
// proberen' een oude job opnieuw door de molen.
initialJobs.forEach(j => {
    if (!activeJobId) activeJobId = j.id;
    if (j.status === 'processing' && !pollTimer) {
        setJobStatus('Recepten worden herkend...', true);
        pollTimer = setInterval(pollJob, 2500);
    } else if (j.status === 'error' && activeJobId === j.id) {
        setJobError(j.error_message);
    }
    if (j.warning) setJobWarning(j.warning);
});

/* ── Croppen ── */
async function openCrop(id) {
    let src = null;
    try {
        const resp = await fetch(`/dump/draft/${id}`);
        if (!resp.ok) return;
        const data = await resp.json();
        src = imageUrl(data.original_image_path || data.image_path);
    } catch (e) { return; }
    if (!src) return;
    openCropModal(src, `/dump/draft/${id}/crop`, (newPath) => {
        const cardImg = document.querySelector(`#draft-${id} img`);
        if (cardImg) cardImg.src = imageUrl(newPath) + '?t=' + Date.now();
    });
}
</script>
{% endblock %}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
<div id="cropModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"
     onclick="if (event.target === this) closeCropModal()">
    <div class="bg-white rounded-lg p-4 max-w-[90vw] max-h-[90vh] flex flex-col gap-3">
        <h3 class="font-bold">Afbeelding bijsnijden</h3>
        <div class="overflow-hidden max-h-[70vh]"><img id="cropImage" class="max-w-full block"></div>
        <p id="cropError" class="hidden text-sm text-red-600"></p>
        <div class="flex gap-2 justify-between items-center">
            <div class="flex gap-2">
                <button type="button" onclick="draaiCropModal(-90)"
                        class="px-3 py-1.5 border border-[#E8E4DC] rounded text-sm">↺ Links</button>
                <button type="button" onclick="draaiCropModal(90)"
                        class="px-3 py-1.5 border border-[#E8E4DC] rounded text-sm">↻ Rechts</button>
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="closeCropModal()" class="px-3 py-1.5 border border-[#E8E4DC] rounded text-sm">Annuleren</button>
                <button type="button" onclick="saveCropModal()" class="px-3 py-1.5 bg-[#8B4513] text-white rounded text-sm">Opslaan</button>
            </div>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/crop-modal.js') }}"></script>

services:
  weekmenu:
    build:
      context: .
      additional_contexts:
        ah: ../../weekmenu-ah   # de AH-connector; zie docker-compose.zonder-ah.yml
        picnic: ../../weekmenu-picnic   # de Picnic-connector; zie docker-compose.zonder-picnic.yml
    ports:
      - "5001:5001"
      - "9002:9002"
    volumes:
      - ./data:/data
      - ./static/uploads:/app/static/uploads
    restart: unless-stopped
    environment:
      - FLASK_APP=app.py
      - DATABASE_URL=sqlite:////data/weekmenu.db
      # De sleutels worden bij voorkeur via /settings ingevuld en in de database
      # bewaard; deze omgevingsvariabelen zijn de terugval als dat (nog) niet is
      # gebeurd. Leeg laten mag: dan pakt de app de sleutel uit de database.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VISION_API_KEY=${VISION_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-}
